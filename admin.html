<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin – Petal &amp; Stem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Petal &amp; Stem · Admin</div>
    <div class="nav"><a href="index.html">View shop</a></div>
  </header>

  <div id="login" class="adm-card adm-login">
    <h2>Admin login</h2>
    <p class="sub">Only the shop owner can sign in.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn" id="loginBtn">Sign in</button>
  </div>

  <div id="app" hidden>
    <div class="adm-card">
      <div class="adm-bar"><h2>Orders</h2><button class="btn ghost sm" id="refreshOrders">Refresh</button></div>
      <div id="orders" style="margin-top:10px"></div>
    </div>
    <div class="adm-card">
      <div class="adm-bar"><h2 id="formTitle">Add a product</h2><button class="btn ghost sm" id="logout">Sign out</button></div>
      <div class="adm-form" style="margin-top:14px">
        <div><label for="f_name">Name</label><input id="f_name"></div>
        <div><label for="f_cat">Category</label><input id="f_cat" list="cats" placeholder="Bouquets, Cakes, Plants..."><datalist id="cats"></datalist></div>
        <div><label for="f_price">Price (₹)</label><input id="f_price" type="number" min="0" step="1" inputmode="numeric"></div>
        <div><label for="f_img">Photo</label><input id="f_img" type="file" accept="image/*"></div>
        <div class="full"><label for="f_desc">Description</label><textarea id="f_desc"></textarea></div>
        <div class="full"><img id="f_prev" class="adm-prev" alt="" hidden></div>
        <div class="full adm-check"><input id="f_active" type="checkbox" checked><label for="f_active" style="margin:0">Show on the shop page</label></div>
      </div>
      <div class="adm-btns"><button class="btn" id="save">Save product</button><button class="btn ghost" id="cancel" hidden>Cancel editing</button></div>
      <p class="adm-msg" id="msg" role="status"></p>
    </div>

    <div class="adm-card">
      <h2>Your products</h2>
      <p class="sub">Change a price right here and press Save. Hidden items stay in this list but customers don’t see them.</p>
      <div id="list"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
